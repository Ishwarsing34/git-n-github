<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Login UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="login-panel">
        <div class="brand-block">
          <div class="logo-wrap">N</div>
          <div>
            <p class="eyebrow">Welcome back</p>
            <h1>Nice to see you again</h1>
          </div>
        </div>

        <form class="login-form" id="loginForm">
          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required />
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" placeholder="Enter your password" required />
              <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
                Show
              </button>
            </div>
          </div>

          <div class="options-row">
            <label class="checkbox-wrap">
              <input type="checkbox" checked />
              <span>Remember me</span>
            </label>
            <a href="#">Forgot password?</a>
          </div>

          <button type="submit" class="primary-btn">Sign in</button>

          <div class="divider"><span>Or continue with</span></div>

          <div class="social-row">
            <button type="button" class="social-btn">Google</button>
            <button type="button" class="social-btn">GitHub</button>
          </div>
        </form>

        <p class="signup-text">Don’t have an account? <a href="#">Create one</a></p>
      </div>

      <div class="visual-panel">
        <div class="floating-card card-top">
          <span class="card-label">Performance</span>
          <strong>+24.8%</strong>
        </div>
        <div class="floating-card card-bottom">
          <span class="card-label">Team sync</span>
          <strong>12 online</strong>
        </div>
        <div class="dashboard-glow"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
